<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        header{

            align-items: center;

        }
        .logo{
            color: black;
            font-size: 20px;
            font-weight:bold ;
        }
        nav {
            padding: 10px;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        li {
            display: inline;
            margin-right: 40px;
        }

        a {
            color:blue;
            text-decoration: none;
            font-size: 18px;
        }
        a:hover {
            color: yellow;
        }
        footer{
            background-color: blue;
            text-align: center;
            text-decoration: underline;
            padding: 15px;
            color: aliceblue;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        form{
            display: inline;
            margin: 20px;
        }
        input{
            padding: 8px;
        }
        button{
            padding: 8px;
            background-color: blue;
            border: none;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo"></div>
        <nav>
        <ul>
            <li><a href="index.html">Home</a></li>

        <form>

    </header>

</html>
